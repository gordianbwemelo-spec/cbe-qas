# Render Blueprint for the CBE Quality Audit System.
# In Render: New + → Blueprint → connect this repository → Apply.
# It creates the PostgreSQL database and the web service together and wires
# DATABASE_URL between them automatically.

databases:
  - name: cbe-qas-db
    databaseName: cbe_qas
    user: cbe_qas
    plan: free

services:
  - type: web
    name: cbe-qas
    runtime: node
    plan: free
    region: oregon            # must match the region of the database
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cbe-qas-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ACADEMIC_YEAR
        value: 2026/2027
      - key: QUARTER
        value: First
